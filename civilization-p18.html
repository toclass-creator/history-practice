<style>
:root{--red:#b4232a;--ink:#242936;--muted:#647084;--line:#e2e6ed;--green:#19764b}*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;line-height:1.7}header{background:linear-gradient(125deg,#8f1c22,#bd3639);color:#fff;padding:26px 18px 24px}.wrap{max-width:860px;margin:auto}h1{font-size:24px;line-height:1.45;margin:6px 0}header p{margin:6px 0 0;font-size:14px;opacity:.92}.eyebrow{font-size:12px;letter-spacing:2px;opacity:.8}.controls{background:#fff;border-bottom:1px solid var(--line);padding:16px 18px}.filter-grid{display:flex;flex-wrap:wrap;gap:12px}label{display:block;font-size:13px;color:var(--muted)}select{font:inherit;font-size:16px;padding:10px 30px 10px 10px;background:#f9fafc;border:1px solid var(--line);border-radius:8px;width:100%;color:var(--ink)}.filter-grid>label{flex:1;min-width:180px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{font:inherit;font-size:14px;min-height:42px;padding:8px 12px;border:1px solid var(--line);background:white;border-radius:8px;color:var(--ink);cursor:pointer}button[aria-pressed=true]{color:var(--red);border-color:var(--red);background:#fff3f4}button:focus-visible,select:focus-visible{outline:3px solid #3266a5;outline-offset:2px}#progress{font-size:13px;color:var(--muted);margin:12px 0 0}.main{padding:18px}.intro{font-size:13px;color:var(--muted);margin:0 0 16px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:16px}.card h2{font-size:18px;color:var(--red);margin:0 0 16px;border-left:4px solid var(--red);padding-left:10px;line-height:1.5}.count{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}.passage{font-size:18px;line-height:3.1;margin:10px 0;overflow-wrap:anywhere}.slot{display:inline-flex;max-width:100%;align-items:center;vertical-align:middle;gap:2px;line-height:1.4;margin:0 3px}.blank{min-width:60px;max-width:calc(100% - 22px);border:0;border-bottom:2px dashed #9aa7bb;border-radius:5px 5px 0 0;background:#edf3fb;color:var(--ink);font:inherit;font-size:17px;height:40px;padding:6px;outline:none}.blank:focus{border-bottom-color:#2a5d8f;background:#e1ecfa}.blank::placeholder{color:#8793a4;font-size:13px}.verdict{display:inline-block;flex:0 0 20px;font-size:17px;text-align:center;font-weight:700}.slot.correct .blank{border-color:var(--green);background:#edf8f0}.slot.correct .verdict{color:var(--green)}.slot.wrong .blank{border-color:var(--red);background:#fff0f2}.slot.wrong .verdict{color:var(--red)}.answer{font-size:15px;color:var(--red);font-weight:600;background:#fff0f5;border-radius:4px;padding:0 4px}.card-actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}.card-actions button{font-size:13px;color:var(--muted)}#resetPanel,#warning{padding:14px;background:#fff5e7;border:1px solid #e8c58d;border-radius:8px;margin:12px 0}#empty{padding:26px;text-align:center;color:var(--muted)}footer{font-size:12px;color:var(--muted);padding:8px 18px 30px;text-align:center}.source-note{font-size:12px;color:var(--muted);margin-top:8px}[hidden]{display:none!important}@media(max-width:480px){h1{font-size:21px}.main{padding:12px}.card{padding:17px 14px}.passage{font-size:17px;line-height:3.2}.filter-grid{gap:8px}.filter-grid>label{min-width:130px}.count{display:block;margin:4px 0 0}.controls{padding:14px 12px}}@media print{.controls,.intro,.card-actions,footer,#warning{display:none}.card{break-inside:avoid;box-shadow:none}body{background:white}}

<header><div class="wrap"><div class="eyebrow">七年级上册历史 · 课文填空</div><h1>第3课 · 中华文明的起源</h1><p>保留课文上下文，把粉红色重点填回原句。</p></div></header>
<div class="controls"><div class="wrap"><div class="filter-grid"><label>选择课程<select id="lesson" aria-label="选择课程"><option value="all">全部课程（本页共1课）</option><option value="3" selected>第3课 中华文明的起源</option></select></label><label>选择知识点<select id="topic" aria-label="选择知识点"><option value="all">全部知识点</option></select></label></div><div class="actions"><button id="wrongOnly" aria-pressed="false">只看错题</button><button id="reset">当前范围清空重做</button></div><p id="progress" role="status"></p><div id="resetPanel" hidden><p id="resetPrompt"></p><button id="confirmReset">确认清空</button> <button id="cancelReset">取消</button></div></div></div>
<main class="wrap main"><div id="warning">交互功能尚未加载。如果这条提示一直显示，请用浏览器打开网页链接。</div><p class="intro">直接在句子空白处填写，离开输入框后自动显示 ✓ 或 ✗。答错也可以继续往下做；修改后离开输入框会重新判断。</p><p id="storage" class="source-note">进度保存在当前浏览器，不跨设备同步。</p><div id="cards"></div><p id="empty" hidden>当前范围没有错题。</p></main>
<footer>依据提供的教材第18页正文整理 · 4个知识点 / 16个空<br>仅粉红色高亮设空，手写批注和普通下划线不设空；“蚩尤”按完整人名设空。</footer>
<script>
const SECTIONS=[{"id": "origin", "title": "中华文明的起源", "paragraphs": ["良渚古城、陶寺古城等考古发现，表明中华文明的起源和初步发展具有{{多元一体}}的特征。距今5000年左右，{{黄河}}、{{长江}}、{{西辽河流域}}都发展出了各具特色的早期文明，它们彼此之间不断交流和融合，{{共同构成了早期中华文明的主体}}。距今4000多年，中原地区在广泛吸收各地文明要素的基础上迅速崛起，经过持续的发展，走向一体，以中原地区为引领的文明新格局开始形成。"]}, {"id": "alliance", "title": "远古的传说 · 部落联盟", "paragraphs": ["我国流传着大量有关远古先民事迹的传说，炎帝、黄帝等是最为著名的人物。", "{{五六千年前}}，我国进入{{部落联盟时期}}。相传，当时黄河流域活动着{{炎帝}}、{{黄帝}}、{{蚩尤}}等几个较大的部落。黄帝联合一些部落，在阪泉与炎帝展开一场大战，最后炎帝失败，归顺黄帝，两大部落结成联盟。后来，炎黄部落联盟与东方的蚩尤部落在涿鹿激战，最终蚩尤战败，其部落部分归附炎黄部落联盟。"]}, {"id": "huaxia", "title": "远古的传说 · 华夏族的形成", "paragraphs": ["炎黄部落联盟的势力和声望大增，{{黄帝}}被推举为{{联盟首领}}。这一部落联盟逐渐演化为后来的{{华夏族}}。后人尊崇炎帝和黄帝为中华民族的{{人文初祖}}，近代以来，海内外华人也以“{{炎黄子孙}}”自称。"]}, {"id": "shanrang", "title": "远古的传说 · 禅让制", "paragraphs": ["相传在黄帝之后，尧、舜、禹依次成为首领。当时实行{{禅让制}}，首领传位给贤德之人。尧鼓励人们发展生产。他年老时，征求各部落意见，推举品行高尚的舜做继承人。舜继位时，制定刑法，完善制度，稳定局势，又派禹治水，解除水患。舜年老时让位于禹。禹治水有功，得到民众爱戴，被尊称为“大禹”。"]}];
const KEY='history-photo-p18-v1';
const aliases={'五六千年前':['五六千年以前','距今五六千年','距今五六千年前','5000到6000年前','5000—6000年前','5000-6000年前'],'部落联盟时期':['部落联盟时代'],'西辽河流域':['西辽河'],'共同构成了早期中华文明的主体':['共同构成早期中华文明的主体'],'联盟首领':['部落联盟首领'],'禅让制':['禅让制度']};
function normalize(s){return String(s).normalize('NFKC').replace(/[\s，,。；;：:！？!?“”‘’、（）()]/g,'');}
function match(value,answer){return [answer,...(aliases[answer]||[])].some(x=>normalize(x)===normalize(value));}
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(!saved||typeof saved!=='object')saved={};}catch(e){document.querySelector('#storage').textContent='当前浏览器无法读取已存进度，本次仍可正常练习。';}
const groups=[];const topic=document.querySelector('#topic');let wrongOnly=false;
function save(){const data={};groups.forEach(g=>g.blanks.forEach(b=>data[b.id]={value:b.input.value,checked:b.checked}));try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){document.querySelector('#storage').textContent='当前浏览器无法保存进度，关闭后可能丢失；本次仍可正常作答。';}}
function scoped(){return groups.filter(g=>topic.value==='all'||g.id===topic.value);}
function updateCounts(){const blanks=scoped().flatMap(g=>g.blanks);document.querySelector('#progress').textContent=`当前范围 ${blanks.length} 空 · 已填写 ${blanks.filter(b=>b.input.value.trim()).length} · 正确 ${blanks.filter(b=>b.status==='correct').length} · 错误 ${blanks.filter(b=>b.status==='wrong').length}`;}
function filter(){const scope=scoped();groups.forEach(g=>{g.el.hidden=!scope.includes(g)||(wrongOnly&&!g.blanks.some(b=>b.status==='wrong'));});document.querySelector('#empty').hidden=groups.some(g=>!g.el.hidden);document.querySelector('#resetPanel').hidden=true;updateCounts();}
function judge(b){b.checked=Boolean(b.input.value.trim());b.status=b.checked?(match(b.input.value,b.answer)?'correct':'wrong'):'';b.slot.classList.remove('correct','wrong');if(b.status)b.slot.classList.add(b.status);b.verdict.textContent=b.status==='correct'?'✓':b.status==='wrong'?'✗':'';b.verdict.setAttribute('aria-label',b.status==='correct'?'正确':b.status==='wrong'?'不正确':'未作答');b.input.setAttribute('aria-invalid',String(b.status==='wrong'));}
function clearGroup(g){g.blanks.forEach(b=>{b.input.value='';judge(b);b.reference.hidden=true;});g.reveal.textContent='查看本段答案';g.reveal.setAttribute('aria-expanded','false');}
SECTIONS.forEach(section=>{const option=document.createElement('option');option.value=section.id;option.textContent=section.title;topic.append(option);const el=document.createElement('section');el.className='card';el.dataset.topic=section.id;const heading=document.createElement('h2');heading.textContent=section.title;el.append(heading);const g={id:section.id,el,blanks:[]};groups.push(g);
section.paragraphs.forEach(text=>{const p=document.createElement('p');p.className='passage';text.split(/(\{\{.*?\}\})/g).forEach(part=>{if(!part.startsWith('{{')){p.append(document.createTextNode(part));return;}const answer=part.slice(2,-2),id=section.id+'-'+g.blanks.length;const slot=document.createElement('span');slot.className='slot';const input=document.createElement('input');input.className='blank';input.type='text';input.autocomplete='off';input.spellcheck=false;input.placeholder='填写';input.style.width=Math.min(300,Math.max(76,answer.length*18+18))+'px';input.setAttribute('aria-label',section.title+'，第'+(g.blanks.length+1)+'空');input.enterKeyHint='done';const verdict=document.createElement('span');verdict.className='verdict';verdict.setAttribute('role','status');const reference=document.createElement('span');reference.className='answer';reference.textContent=answer;reference.hidden=true;slot.append(input,verdict);p.append(slot,reference);const b={id,slot,input,verdict,reference,answer,checked:false,status:''};g.blanks.push(b);const prior=saved[id];if(prior&&typeof prior.value==='string'){input.value=prior.value;if(prior.checked===true)judge(b);}input.addEventListener('input',()=>{b.checked=false;b.status='';slot.classList.remove('correct','wrong');verdict.textContent='';verdict.setAttribute('aria-label','待校验');input.removeAttribute('aria-invalid');save();updateCounts();});input.addEventListener('blur',()=>{judge(b);save();updateCounts();});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();input.blur();}});});el.append(p);});const count=document.createElement('span');count.className='count';count.textContent=g.blanks.length+'个空';heading.append(count);const actions=document.createElement('div');actions.className='card-actions';const reveal=document.createElement('button');reveal.textContent='查看本段答案';reveal.setAttribute('aria-expanded','false');g.reveal=reveal;reveal.addEventListener('click',()=>{const show=reveal.getAttribute('aria-expanded')!=='true';g.blanks.forEach(b=>b.reference.hidden=!show);reveal.setAttribute('aria-expanded',String(show));reveal.textContent=show?'收起本段答案':'查看本段答案';});const reset=document.createElement('button');reset.textContent='本段重做';reset.addEventListener('click',()=>{clearGroup(g);save();updateCounts();});actions.append(reveal,reset);el.append(actions);document.querySelector('#cards').append(el);});
topic.addEventListener('change',filter);document.querySelector('#lesson').addEventListener('change',filter);document.querySelector('#wrongOnly').addEventListener('click',e=>{wrongOnly=!wrongOnly;e.target.textContent=wrongOnly?'返回全部':'只看错题';e.target.setAttribute('aria-pressed',String(wrongOnly));filter();});let resetTargets=[];document.querySelector('#reset').addEventListener('click',()=>{resetTargets=groups.filter(g=>!g.el.hidden);const count=resetTargets.reduce((n,g)=>n+g.blanks.length,0);document.querySelector('#resetPrompt').textContent=count?`清空当前显示的 ${count} 个空及其作答记录？`:'当前没有可清空的内容。';document.querySelector('#confirmReset').disabled=count===0;document.querySelector('#resetPanel').hidden=false;});document.querySelector('#cancelReset').addEventListener('click',()=>document.querySelector('#resetPanel').hidden=true);document.querySelector('#confirmReset').addEventListener('click',()=>{resetTargets.forEach(clearGroup);save();filter();});filter();document.querySelector('#warning').hidden=true;
</script></body></html>
